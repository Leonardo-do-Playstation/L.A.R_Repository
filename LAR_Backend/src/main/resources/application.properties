# Vai ser usado quando o bootstrap do spring forçar a criação do banco de dados, mas como o banco já existe, ele vai apenas atualizar as tabelas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.deferred-datasource-initialization=true
spring.sql.init.mode=ALWAYS

# Usa as chaves para receber variaveis de senha e usuario do .env na raiz do projeto

spring.datasource.url=jdbc:mysql://localhost:3307/lar_db
spring.datasource.username=admin
spring.datasource.password=caramelo
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
