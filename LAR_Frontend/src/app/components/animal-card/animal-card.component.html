<article class="animal-card">

    <div class="animal-card__foto-wrapper">

        <img [src]="imagemAnimal()" [alt]="animal.nome" class="animal-card__imagem" (error)="erroImagem($event)">

        @if (exibirStatus && animal.status) {

        <span class="animal-card__selo" [class]="classeStatus()">{{ nomeStatus() }}</span>

        }

        <button type="button" class="animal-card__favorito" [disabled]="usuarioLogado && processandoFavorito"
            [attr.aria-label]="(usuarioLogado ? 'Favoritar ' : 'Entrar para favoritar ') + animal.nome"
            [attr.aria-pressed]="usuarioLogado ? favoritado : null"
            (click)="alternarFavorito($event)">

            @if (usuarioLogado && favoritado) {
            <img src="/assets/coracao-preenchido.svg" alt="">
            } @else {
            <img src="/assets/coracao.svg" alt="">
            }

        </button>

    </div>

    <div class="animal-card__conteudo">

        <div class="animal-card__linha">

            <strong>
                <a class="animal-card__link" [routerLink]="['/animais', animal.id]">{{ animal.nome }}</a>
            </strong>

        </div>

        <p class="animal-card__detalhes" [title]="detalhesTexto()">
            {{ detalhesTexto() }}
        </p>

        <div class="animal-card__linha animal-card__linha--rodape">

            <span class="animal-card__sexo" [class.animal-card__sexo--macho]="animal.sexo === 'MACHO'"
                [class.animal-card__sexo--femea]="animal.sexo === 'FEMEA'">

                @if (animal.sexo === 'MACHO') {

                <img src="/assets/sexo-masculino.svg" alt="Macho">

                } @else {

                <img src="/assets/sexo-feminino.svg" alt="Fêmea">

                }

            </span>

            <span class="animal-card__ong">
                {{ animal.ong.nome }}
            </span>

        </div>

    </div>

</article>
