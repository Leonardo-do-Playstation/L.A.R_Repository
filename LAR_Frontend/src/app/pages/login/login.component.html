<section class="login">

  <div class="login__container">

    <div class="login__logo">
      L.A.R.
    </div>

    <h1>Fazer Login</h1>

    <form [formGroup]="loginForm" (ngSubmit)="entrar()">

      <div class="login__field">
        <label for="email">E-mail</label>

        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email">
      </div>

      <div class="login__field">
        <label for="senha">Senha</label>

        <input
          id="senha"
          type="password"
          formControlName="senha"
          autocomplete="current-password">
      </div>

      <a class="login__forgot" routerLink="/recuperar-senha">
        Esqueceu a senha?
      </a>

      <button
        type="submit"
        class="login__button">
        Entrar
      </button>

    </form>

    <div class="login__divider"></div>

    <p class="login__register">
      Não cadastrado?&nbsp;
      <a routerLink="/cadastro">Cadastre-se</a>
    </p>

  </div>

</section>
