<section class="lista-ongs">

    <div class="lista-ongs__container">

        <app-botao-voltar fallback="/home" />

        <h1 class="lista-ongs__titulo">
            ONGs parceiras
        </h1>

        @if (carregando) {

        <app-mensagem-estado tipo="carregando" texto="Carregando ONGs..." />

        } @else if (erro) {

        <app-mensagem-estado tipo="erro" [texto]="erro" />

        } @else if (ongs.length === 0) {

        <app-mensagem-estado tipo="vazio" titulo="Nenhuma ONG disponível no momento." texto="Volte mais tarde para conhecer as instituições parceiras." />

        } @else {

        <div class="lista-ongs__lista">

            @for (ong of ongs; track ong.id) {

            <article class="ong-card">

                <div class="ong-card__foto" aria-hidden="true">
                    {{ inicial(ong.nome) }}
                </div>

                <div class="ong-card__info">

                    <strong class="ong-card__nome">
                <a class="ong-card__link" [routerLink]="['/ongs', ong.id]">{{ ong.nome }}</a>
            </strong>

                    <span class="ong-card__localizacao">
                        {{ ong.endereco || 'Localização não informada' }}
                    </span>
                </div>
            </article>
            }
        </div>
        }
    </div>
</section>
