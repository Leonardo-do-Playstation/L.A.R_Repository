<section class="lista-ongs">

    <div class="lista-ongs__container">

        <app-botao-voltar fallback="/home" />

        <h1 class="lista-ongs__titulo">
            ONGs parceiras
        </h1>

        <div class="lista-ongs__filtros">

            <div class="lista-ongs__campo">
                <label for="filtro-nome">Nome</label>
                <input id="filtro-nome" type="search" placeholder="Buscar por nome da ONG" [value]="nome"
                    (input)="aoDigitarNome($any($event.target).value)">
            </div>

            <div class="lista-ongs__campo">
                <label for="filtro-cidade">Cidade</label>
                <input id="filtro-cidade" type="search" placeholder="Buscar por cidade" [value]="cidade"
                    (input)="aoDigitarCidade($any($event.target).value)">
            </div>

            @if (temFiltro) {
            <button type="button" class="lista-ongs__limpar" (click)="limparFiltros()">
                Limpar filtros
            </button>
            }

        </div>

        @if (carregando) {

        <div class="lista-ongs__lista" aria-busy="true">

            <app-skeleton variante="ong-card" [quantidade]="5" texto="Carregando…" />

        </div>

        } @else if (erro) {

        <app-mensagem-estado tipo="erro" [texto]="erro" />

        } @else if (ongs.length === 0) {

        @if (temFiltro) {

        <app-mensagem-estado tipo="vazio" titulo="Nenhuma ONG encontrada."
            texto="Ajuste os filtros para ver outros resultados." />

        } @else {

        <app-mensagem-estado tipo="vazio" titulo="Nenhuma ONG disponível no momento."
            texto="Volte mais tarde para conhecer as instituições parceiras." />

        }

        } @else {

        <div class="lista-ongs__lista">

            @for (ong of ongs; track ong.id) {

            <article class="ong-card">

                <app-ong-avatar [foto]="ong.foto" [nome]="ong.nome" [tamanho]="52" />

                <div class="ong-card__info">

                    <strong class="ong-card__nome">
                        <a class="ong-card__link" [routerLink]="['/ongs', ong.id]">{{ ong.nome }}</a>
                    </strong>

                    <span class="ong-card__localizacao">
                        {{ ong.endereco || 'Localização não informada' }}
                    </span>
                </div>
            </article>
            }
        </div>
        }
    </div>
</section>
