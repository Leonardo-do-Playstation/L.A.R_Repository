<section class="favoritos">

    <div class="favoritos__container">

        <app-botao-voltar fallback="/home" />

        <h1 class="favoritos__titulo">
            Meus Favoritos
        </h1>

        @if (erro) {

        <app-mensagem-estado tipo="erro" [texto]="erro" />

        }

        @if (carregando) {

        <app-mensagem-estado tipo="carregando" texto="Carregando favoritos..." />

        } @else if (animais.length === 0 && !erro) {

        <app-mensagem-estado tipo="vazio" titulo="Você ainda não favoritou nenhum animal." texto="Toque no coração de um animal para guardá-lo aqui.">
            <a routerLink="/catalogo" class="favoritos__link">
                Ver animais para adoção
            </a>
        </app-mensagem-estado>

        } @else {

        <div class="favoritos__lista">

            @for (animal of animais; track animal.id) {

            <app-animal-card [animal]="animal" [favoritado]="true"
                (favoritoAlterado)="aoAlterarFavorito(animal.id, $event)" (erroFavorito)="erro = $event">
            </app-animal-card>
            }
        </div>
        }
    </div>
</section>
