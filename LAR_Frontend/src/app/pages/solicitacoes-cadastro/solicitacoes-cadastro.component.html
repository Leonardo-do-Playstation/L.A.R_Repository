<section class="solicitacoes">

    <div class="solicitacoes__container">

        <app-botao-voltar fallback="/home" />

        <h1 class="solicitacoes__titulo">
            Solicitações de Cadastro
        </h1>

        @if (erro) {

        <app-mensagem-estado tipo="erro" [texto]="erro" />

        }

        @if (carregando) {

        <app-mensagem-estado tipo="carregando" texto="Carregando solicitações..." />

        } @else if (solicitacoes.length === 0) {

        <app-mensagem-estado tipo="vazio" titulo="Nenhuma solicitação pendente." texto="Novos cadastros de ONGs aparecerão aqui." />

        } @else {

        <div class="solicitacoes__lista">

            @for (solicitacao of solicitacoes; track solicitacao.id) {

            <article class="solicitacao-card">

                <strong class="solicitacao-card__nome">
                <a class="solicitacao-card__link" [routerLink]="['/admin/ongs-pendentes', solicitacao.id]">{{ solicitacao.nome }}</a>
            </strong>

                <span class="solicitacao-card__tempo">
                    {{ tempoRelativo(solicitacao.data_cadastro) }}
                </span>

            </article>
            }
        </div>
        }
    </div>
</section>
