<section class="painel-animais">

    <div class="painel-animais__container">

        <button type="button" class="painel-animais__cadastrar">
            Cadastrar Animal
        </button>

        <div class="painel-animais__filtros">

            <button type="button" class="painel-animais__filtros-button">
                <span><img src="/assets/filtro.svg" alt="Filtro"></span>
                Filtros
            </button>

        </div>

        <div class="painel-animais__ordenacao">
            <button type="button">Mais recentes</button>
            <button type="button">Mais antigos</button>
        </div>

        <div class="painel-animais__lista">

            <article class="animal-card">

                <img src="/assets/Thor.jpg" alt="Thor" class="animal-card__imagem">

                <div class="animal-card__conteudo">

                    <div class="animal-card__linha">

                        <strong>Thor</strong>

                        <span class="animal-card__status">
                            Status
                            <span class="animal-card__status-dot
                       animal-card__status-dot--disponivel">
                            </span>
                        </span>

                    </div>

                    <div class="animal-card__linha animal-card__linha--acoes">

                        <span class="animal-card__sexo animal-card__sexo--macho">
                            <img src="/assets/sexo-masculino.svg" alt="Macho">
                        </span>

                        <button type="button" class="animal-card__editar">
                            Editar
                        </button>

                        <button type="button" class="animal-card__excluir" aria-label="Excluir Thor">

                            <img src="/assets/lixeira.svg" alt="Excluir">

                        </button>

                    </div>

                </div>

            </article>

            <article class="animal-card">

                <img src="/assets/Pandora.jpg" alt="Pandora" class="animal-card__imagem">

                <div class="animal-card__conteudo">

                    <div class="animal-card__linha">

                        <strong>Pandora</strong>

                        <span class="animal-card__status">
                            Status
                            <span class="animal-card__status-dot
                       animal-card__status-dot--indisponivel">
                            </span>
                        </span>

                    </div>

                    <div class="animal-card__linha animal-card__linha--acoes">

                        <span class="animal-card__sexo animal-card__sexo--femea">
                            <img src="/assets/sexo-feminino.svg" alt="Fêmea">
                        </span>

                        <button type="button" class="animal-card__editar">
                            Editar
                        </button>

                        <button type="button" class="animal-card__excluir" aria-label="Excluir Pandora">

                            <img src="/assets/lixeira.svg" alt="Excluir">

                        </button>

                    </div>

                </div>

            </article>

            <article class="animal-card">

                <img src="/assets/Docinho.jpg" alt="Docinho" class="animal-card__imagem">

                <div class="animal-card__conteudo">

                    <div class="animal-card__linha">

                        <strong>Docinho</strong>

                        <span class="animal-card__status">
                            Status
                            <span class="animal-card__status-dot
                       animal-card__status-dot--disponivel">
                            </span>
                        </span>

                    </div>

                    <div class="animal-card__linha animal-card__linha--acoes">

                        <span class="animal-card__sexo animal-card__sexo--femea">
                            <img src="/assets/sexo-feminino.svg" alt="Fêmea">
                        </span>

                        <button type="button" class="animal-card__editar">
                            Editar
                        </button>

                        <button type="button" class="animal-card__excluir" aria-label="Excluir Docinho">

                            <img src="/assets/lixeira.svg" alt="Excluir">

                        </button>

                    </div>

                </div>

            </article>

            <article class="animal-card">

                <img src="/assets/Snow.jpg" alt="Snow" class="animal-card__imagem">

                <div class="animal-card__conteudo">

                    <div class="animal-card__linha">

                        <strong>Snow</strong>

                        <span class="animal-card__status">
                            Status
                            <span class="animal-card__status-dot
                       animal-card__status-dot--indisponivel">
                            </span>
                        </span>

                    </div>

                    <div class="animal-card__linha animal-card__linha--acoes">

                        <span class="animal-card__sexo animal-card__sexo--macho">
                            <img src="/assets/sexo-masculino.svg" alt="Macho">
                        </span>

                        <button type="button" class="animal-card__editar">
                            Editar
                        </button>

                        <button type="button" class="animal-card__excluir" aria-label="Excluir Snow">

                            <img src="/assets/lixeira.svg" alt="Excluir">

                        </button>

                    </div>

                </div>

            </article>

        </div>

        <button type="button" class="painel-animais__ver-mais">
            Ver mais
        </button>

    </div>

</section>
